# Publish the web app to GitHub Pages.
#
# Pages can only serve a repository's root or its /docs folder directly, and
# the bundle lives in webapp/static, so it is uploaded as an artifact instead.
# That also keeps the repo layout unchanged.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions". Until that is
# done this workflow has nothing to deploy to and will fail.
name: Deploy web app

on:
  push:
    branches: [master]
    paths:
      - "webapp/static/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check a ratings snapshot is present
        run: |
          if [ ! -f webapp/static/ratings.json ]; then
            echo "::warning::webapp/static/ratings.json is missing — the site will \
          deploy but show no data. Run 'python main.py --refresh' and commit the result."
          else
            echo "Snapshot present: $(wc -c < webapp/static/ratings.json) bytes"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/static

      - id: deployment
        uses: actions/deploy-pages@v4
