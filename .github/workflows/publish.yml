# Publish the app to GitHub Pages, and run the league scrape on demand.
#
# Runs on two triggers:
#   push to master    — publish; this is how a local scrape reaches the app
#   workflow_dispatch — scrape or diagnose on demand
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions". Until that is
# done the deploy job has nowhere to publish to and will fail.
#
# Scrape and deploy live in one workflow on purpose. A push made with the
# default GITHUB_TOKEN does not trigger other workflows, so a separate deploy
# workflow would never fire after the scrape job commits.
name: Publish

on:
  # No scheduled runs. Since 18 October 2026 Cloudflare has challenged
  # requests from GitHub's runners — they are datacenter IPs — so a scrape
  # from here fetches nothing however often it runs. Results now come from
  # `publish.py` on a home connection, and this workflow's job is to deploy
  # what that pushes. Dispatch still works for squads, diagnostics and a
  # manual deploy; it just will not get past the challenge for results.
  workflow_dispatch:
    inputs:
      results_only:
        description: >-
          Any value skips the squad refresh, which is the slow half — a
          results-only run takes under a minute against about four. Use it
          when you just want tonight's scores in.
        type: string
        default: ""
      fetch_structure:
        description: >-
          Season to fetch the published division structure for (e.g. 2026-27).
          Leave blank to scrape results as normal. Structure runs commit the
          team map and skip the deploy, since they change no published data.
        type: string
        default: ""
      fetch_squads:
        description: >-
          Season to scrape team squads for (e.g. 2026-27). Squads fill up over
          the first weeks of a season, so this is worth re-running. Commits the
          squad file; skips the results scrape.
        type: string
        default: ""
      validate_parser:
        description: >-
          Division to check the new parser against last season's cached
          matches (e.g. 4). Fetches nothing else and commits nothing.
        type: string
        default: ""
      report_fixtures:
        description: >-
          Season to report the published fixture list for (e.g. 2026-27),
          as "<season> <division slug> [team]". The fixture list is the
          honest team list — a team that registered then withdrew appears in
          the team map but in nobody's fixtures. Commits nothing.
        type: string
        default: ""
      diagnose:
        description: >-
          Season to report what the fixtures pages currently hold (e.g.
          2026-27), for when the scrape stops finding results. Writes
          data/diagnosis.txt and commits it, because job logs and artifacts
          both come from blob storage the development sandbox cannot read.
        type: string
        default: ""
      fetch_pages:
        description: >-
          Season to download raw league pages for (e.g. 2026-27), uploaded as
          an artifact. For writing a parser against markup that cannot be
          reached from a development sandbox. Commits nothing, deploys
          nothing.
        type: string
        default: ""
  push:
    branches: [master]
    paths:
      - "webapp/static/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: write   # the scrape job commits new ratings
  pages: write
  id-token: write

# Let a running publish finish rather than cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    # A push has nothing new to fetch — it is already the new data.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv reads .python-version and fetches the interpreter if the runner
      # does not already have it.
      - run: uv sync

      # Prints to the log rather than uploading: artifact blob storage is
      # not reachable from the sandbox this is written in, but job logs are.
      - name: Report league page structure
        if: inputs.fetch_pages != ''
        run: uv run python fetch_pages.py "${{ inputs.fetch_pages }}"

      - name: Validate the new parser against cached results
        if: inputs.validate_parser != ''
        run: uv run python validate_parser.py "${{ inputs.validate_parser }}" 10

      - name: Report the published fixture list
        if: inputs.report_fixtures != ''
        run: uv run python report_fixtures.py ${{ inputs.report_fixtures }}

      - name: Diagnose the fixtures pages
        if: inputs.diagnose != ''
        run: uv run python diagnose.py "${{ inputs.diagnose }}"

      - name: Fetch team squads
        if: inputs.fetch_squads != ''
        run: uv run python fetch_squads.py "${{ inputs.fetch_squads }}"

      - name: Fetch the published division structure
        if: inputs.fetch_structure != ''
        run: uv run python fetch_structure.py "${{ inputs.fetch_structure }}"

      - name: Scrape for new results
        if: inputs.fetch_structure == '' && inputs.fetch_pages == '' && inputs.fetch_squads == '' && inputs.validate_parser == '' && inputs.report_fixtures == '' && inputs.diagnose == ''
        run: uv run python main.py --update

      # Squads fill up over the opening weeks of a season, so a full run
      # refreshes them alongside results. Failure here must not stop the
      # results scrape, which is the more important half — hence results
      # first, which fetch_squads.py also depends on: it decides whether a
      # team's page is still its registration list by whether that team has
      # played, and reading that from a stale cache lets the page overwrite a
      # squad with just the players who happen to have turned out.
      - name: Refresh squads
        if: inputs.fetch_structure == '' && inputs.fetch_pages == '' && inputs.fetch_squads == '' && inputs.validate_parser == '' && inputs.report_fixtures == '' && inputs.diagnose == ''
          && inputs.results_only == ''
        continue-on-error: true
        run: uv run python fetch_squads.py 2026-27

      # Ratings are exported by main.py --update, before the squad refresh
      # above, so rebuild the snapshot once the squads are settled.
      - name: Rebuild the published snapshot
        if: inputs.fetch_structure == '' && inputs.fetch_pages == '' && inputs.fetch_squads == '' && inputs.validate_parser == '' && inputs.report_fixtures == '' && inputs.diagnose == ''
        run: uv run python -m webapp.export

      - name: Verify the match format still holds
        if: inputs.fetch_structure == '' && inputs.fetch_pages == '' && inputs.fetch_squads == '' && inputs.validate_parser == '' && inputs.report_fixtures == '' && inputs.diagnose == ''
        run: uv run python check_doubles.py

      - name: Commit if anything changed
        if: inputs.fetch_pages == '' && inputs.validate_parser == '' && inputs.report_fixtures == ''
        run: |
          # git status, not git diff: on the first run these files are
          # untracked, and git diff ignores untracked files entirely.
          if [ -z "$(git status --porcelain -- data webapp/static/ratings.json)" ]; then
            echo "No new results — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data webapp/static/ratings.json
            if [ -n "${{ inputs.fetch_squads }}" ]; then
              git commit -m "Update ${{ inputs.fetch_squads }} squads"
            elif [ -n "${{ inputs.fetch_structure }}" ]; then
              git commit -m "Add published ${{ inputs.fetch_structure }} division structure"
            else
              git commit -m "Update ratings from a scrape"
            fi
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
              "HEAD:${{ github.ref_name }}"
            echo "Committed new results."
          fi

  deploy:
    needs: [scrape]
    # Runs after a successful scrape, and on push where scrape is skipped.
    # A structure fetch publishes nothing, and may be run from a branch, so
    # it must never deploy over the live site.
    # Pages only accepts a deploy from the default branch, so a plain dispatch
    # against a working branch would fail here and mark the whole run red for
    # no reason — the scrape it ran is still valid.
    if: >-
      always()
      && github.ref == 'refs/heads/master'
      && inputs.fetch_structure == ''
      && inputs.fetch_pages == ''
      && inputs.fetch_squads == ''
      && inputs.validate_parser == ''
      && inputs.report_fixtures == ''
      && inputs.diagnose == ''
      && needs.scrape.result != 'failure'
      && needs.scrape.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fresh checkout, so a commit the scrape job just pushed is included.
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Check a ratings snapshot is present
        run: |
          if [ ! -f webapp/static/ratings.json ]; then
            echo "::warning::webapp/static/ratings.json is missing — the site will \
          deploy but show no data. Run 'python main.py --refresh' and commit the result."
          else
            echo "Snapshot present: $(wc -c < webapp/static/ratings.json) bytes"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/static

      - id: deployment
        uses: actions/deploy-pages@v4
